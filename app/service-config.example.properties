# Copy values into local.properties or a CI secret store. Never commit real secrets.
# Firebase: add app/google-services.json locally after creating the Firebase Android app.
FIREBASE_DATABASE_URL=https://YOUR_PROJECT-default-rtdb.firebaseio.com
# Cloudinary unsigned upload preset is safe for client upload when restricted by folder/type.
CLOUDINARY_CLOUD_NAME=your_cloud_name
CLOUDINARY_UPLOAD_PRESET=your_unsigned_preset
# Optional Supabase REST fallback for server-side extensions.
SUPABASE_URL=https://your-project.supabase.co
SUPABASE_ANON_KEY=your_anon_key
